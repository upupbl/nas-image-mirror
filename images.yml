version: 1

# `target` values are relative to the destination registry and namespace.
# A single source tag keeps its upstream multi-platform manifest intact.
images:
  - id: immich-server
    source: ghcr.io/immich-app/immich-server:v3.1.0
    targets:
      home: immich/server:v3.1.0
      aliyun: immich-server:v3.1.0
    required_platforms: [linux/amd64, linux/arm64]

  - id: immich-machine-learning
    source: ghcr.io/immich-app/immich-machine-learning:v3.1.0
    targets:
      home: immich/machine-learning:v3.1.0
      aliyun: immich-machine-learning:v3.1.0
    required_platforms: [linux/amd64, linux/arm64]

  - id: immich-postgres
    source: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    targets:
      home: immich/postgres:14-vectorchord0.4.3-pgvectors0.2.0
      aliyun: immich-postgres:14-vectorchord0.4.3-pgvectors0.2.0

  - id: valkey-9
    source: docker.io/valkey/valkey:9
    targets:
      home: common/valkey:9
      aliyun: valkey:9
    required_platforms: [linux/amd64, linux/arm64]

  - id: postgres-18
    source: docker.io/library/postgres:18
    targets:
      home: common/postgres:18
      aliyun: postgres:18
    required_platforms: [linux/amd64, linux/arm64]

  - id: qbittorrent
